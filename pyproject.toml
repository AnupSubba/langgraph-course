[project]
name = "langgraph-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anup.subba", email = "anup.subba@globallogic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langgraph-course = "langgraph_course:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
